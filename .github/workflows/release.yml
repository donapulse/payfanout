# Changesets release automation: on every push to main, opens/refreshes a
# "Version Packages" PR from pending changesets; merging that PR publishes to
# npm. Requires the NPM_TOKEN secret.
#
# Nothing here runs on pull requests, so a change to this file — or to the
# action it pins — is first exercised by an actual release. Treat edits
# accordingly, and check that tags and GitHub Releases really appeared.
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # changesets/action v2 no longer writes .npmrc itself; setup-node does
          # it, and `changeset publish` reads NODE_AUTH_TOKEN from that config.
          # NODE_AUTH_TOKEN is scoped to the publish step, so the steps before it
          # log "Failed to replace env in config: ${NODE_AUTH_TOKEN}" and carry on
          # with the default registry. That warning is expected, not a failure.
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Same gate as CI: typecheck + boundaries + tests, then build dist.
      - run: pnpm run check
      - run: pnpm run build

      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          publish-script: pnpm exec changeset publish
          # v2 defaults to pushing release commits and tags through the GitHub
          # API, which would re-attribute them. v1 used the Git CLI; keep it.
          push-with-git-cli: true
        env:
          # No GITHUB_TOKEN here: the github-token input already defaults to the
          # workflow token, and v2 fails the step if the variable is set to
          # anything different.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
