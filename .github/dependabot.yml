# Automated dependency updates. Grouped weekly PRs keep noise low; the CI
# gate (lint/types/tests/build) plus dependency-review vet every bump.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    open-pull-requests-limit: 5
    ignore:
      # Compiler majors are adopted deliberately, not via the weekly group:
      # typescript-eslint has no TypeScript 7 support yet, so a grouped bump
      # crashes the lint gate.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # jsdom 30 requires Node >= 22.22.2: it depends on undici 8, whose
      # CacheStorage calls worker_threads.markAsUncloneable, which Node 20 does
      # not have. Importing jsdom throws there, so every jsdom-environment suite
      # dies before it starts on the Node 20 test leg. Revisit when the matrix
      # drops Node 20.
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
      # Changesets CLI 3 requires Node >= 22.11 and is only driven by
      # changesets/action v2, so adopting it means migrating release.yml and
      # dropping Node 20 in the same change. Not a weekly-group bump.
      - dependency-name: "@changesets/cli"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
