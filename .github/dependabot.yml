# Automated dependency updates. Grouped weekly PRs keep noise low; the CI
# gate (lint/types/tests/build) plus dependency-review vet every bump.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    open-pull-requests-limit: 5
    ignore:
      # Compiler majors are adopted deliberately, not via the weekly group:
      # typescript-eslint has no TypeScript 7 support yet, so a grouped bump
      # crashes the lint gate.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Changesets CLI 3 declares engines.node "^22.11 || ^24 || >=26", which the
      # test matrix now satisfies, but it is driven only by changesets/action v2
      # — and moving to v2 means rewriting release.yml in the same change
      # (renamed inputs, and npm auth moving off NPM_TOKEN to registry-url plus
      # NODE_AUTH_TOKEN). Held until that migration lands, then dropped together
      # with the changesets/action entry below. Scoped to majors, so patch and
      # minor updates still open PRs as usual; a security fix that exists only in
      # the held major is suppressed too, and the Dependabot alert is the signal
      # there.
      - dependency-name: "@changesets/cli"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    ignore:
      # changesets/action v2 is built for Changesets CLI 3; v1 is the line built
      # for CLI 2, which is what this repo declares. v2 validates the declared
      # CLI range before it acts on any release input and fails the step
      # outright, with an error naming v1 as the supported action for CLI 2 — so
      # a stray bump reddens the release run rather than mis-publishing. It also
      # renames seven of its eleven inputs (cwd and github-token keep their
      # names); release.yml passes one of them, publish -> publish-script. And it
      # no longer writes .npmrc from NPM_TOKEN, so npm auth would move to
      # registry-url plus NODE_AUTH_TOKEN. Adopting v2 therefore means taking
      # @changesets/cli 3 and rewriting release.yml in one change. Since
      # release.yml pins the floating @v1 ref, this entry silences the only PR
      # dependabot can raise for the action, and per GitHub's docs it also
      # suppresses a security PR whose fix needs a major; the Dependabot alert
      # feed still surfaces those, and a v2-only advisory fix would need a manual
      # bump. The Node floor that used to block this is gone (the matrix now runs
      # 22 and 24); what remains is the release.yml rewrite, so revisit together
      # with the @changesets/cli hold above when that migration is done.
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]
